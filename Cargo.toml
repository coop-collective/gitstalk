[workspace]
resolver = "3"
# Each container crate lives in the Worker package that owns it (packages/<worker>/container).
members = [
  "packages/gateway/container",
  "packages/ssh/container",
  "packages/actions-executor/container",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
# The Actions job runner (packages/actions-executor/container): masking encodes secrets as a log could show them.
base64 = "0.23"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2"
nix = { version = "0.31", default-features = false, features = ["signal"] }
regex = "1"
# Plain HTTP only (the SSH server reaches the gateway through its container's outbound handler).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
roxmltree = "0.21"
# The SSH server (packages/ssh/container): ring instead of aws-lc-rs, so the amd64 image
# cross-compiles with the runner's toolchain; rsa accepts people's RSA keys.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "net",
  "process",
  "fs",
  "time",
  "io-util",
  "sync",
] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# The Actions job runner reads and rewrites one job of a workflow file (pure Rust, YAML 1.2).
yaml-rust2 = "0.13"
# test only
http-body-util = "0.1"
insta = { version = "1", features = ["json"] }
proptest = "1"
rand = "0.10"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
as_conversions = "warn"
missing_errors_doc = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
