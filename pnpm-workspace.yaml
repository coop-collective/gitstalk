packages:
  - 'packages/*'
  # Race tooling with its own tests (the swarm Worker); research/ is otherwise outside the build.
  - 'research/swarm'

allowBuilds:
  # core-js-pure's postinstall only prints a message (agents → mimetext → @babel/runtime-corejs3).
  core-js-pure: false
  esbuild: true
  workerd: true

# One version per dependency across the repo. Packages reference these with
# "hono": "catalog:" instead of a literal version.
catalog:
  '@actions/expressions': 0.3.61
  '@actions/workflow-parser': 0.3.61
  '@cloudflare/containers': 0.3.7
  '@cloudflare/vite-plugin': 1.62.5
  '@cloudflare/vitest-pool-workers': 0.22.0
  '@cloudflare/workers-oauth-provider': 1.2.3
  '@fontsource-variable/jetbrains-mono': 5.3.0
  '@fontsource-variable/space-grotesk': 5.3.0
  '@hono/zod-validator': 0.9.1
  '@modelcontextprotocol/client': 2.0.0
  '@modelcontextprotocol/server': 2.0.0
  '@simplewebauthn/browser': 14.0.0
  '@simplewebauthn/server': 14.0.3
  '@tanstack/query-sync-storage-persister': 5.104.1
  '@tanstack/react-query': 5.104.1
  '@tanstack/react-query-persist-client': 5.104.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/node': 26.6.4
  '@vitejs/plugin-react': 6.1.1
  '@vitejs/plugin-rsc': 0.5.35
  agents: 0.26.0
  acorn: 8.18.0
  diff: 9.0.0
  esbuild: 0.28.1
  fast-check: 4.10.2
  hono: 4.13.12
  jose: 6.2.12
  oxc-transform-react: 0.145.0
  react: 19.3.0
  react-dom: 19.3.0
  react-server-dom-webpack: 19.3.0
  smol-toml: 1.9.0
  typescript: 7.0.2
  vinext: 1.1.0
  vite: 8.3.2
  vitest: 4.1.11
  wrangler: 4.147.0
  yaml: 2.9.1
  zod: 4.6.5

minimumReleaseAgeExclude:
  - wrangler@4.147.0
  - '@cloudflare/workers-oauth-provider@1.2.3'
